CONFIG_CJSON=y

# Habilita a Biblioteca C completa com suporte a arquivos
CONFIG_NEWLIB_LIBC=y

# Liga a ponte entre o fopen() do C e o Virtual File System do Zephyr
CONFIG_POSIX_API=y
