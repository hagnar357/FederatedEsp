CONFIG_WIFI=y

CONFIG_WIFI_ESP32=y
CONFIG_WIFI_LOG_LEVEL_INF=y


# Network Configuration
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NETWORKING=y

CONFIG_NET_MAX_CONN=20
CONFIG_NET_MAX_CONTEXTS=20

# LOG Configuration
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y



# --- Rede básica ---
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y


# --- Gerenciamento de rede ---
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_THREAD=y

# --- WebSocket & HTTP ---
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y


# --- Gerenciamento de Memória e Stack ---
# Heap global para o k_malloc (rede neural + parsing do JSON recebido via HTTP/WebSocket).
# A região dram0_0_seg desta placa (Heltec Wireless Stick Lite V3, sem PSRAM) tem ~327KB no total,
# dos quais ~224KB já são usados pelo firmware/Wi-Fi antes de qualquer alocação dinâmica nossa --
# ou seja, ~103KB é o teto real de folga, não importa o valor aqui. 98304 (96KB) usa boa parte
# dessa folga mantendo uma margem de segurança para pilha/outros buffers estáticos.
# Com o teacher no modo encoder-decoder atual (TEACHER_ENCODER/DECODER_NEURONS=16), a árvore cJSON
# temporária usada para RECEBER o teacher (todo nó faz isso para a destilação) é bem maior que a
# rede final em si -- se um nó real travar por falta de memória ao baixar o teacher, reduza
# TEACHER_ENCODER_NEURONS/TEACHER_DECODER_NEURONS no configs.h do servidor antes de tentar subir
# esse valor ainda mais (não há mais folga de DRAM para isso).
CONFIG_HEAP_MEM_POOL_SIZE=98304

# Aumenta a pilha da thread principal para lidar com a recursividade do cJSON e buffers de rede
CONFIG_MAIN_STACK_SIZE=8192

# --- Sistema de Arquivos (LittleFS) ---
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# # --- Sensores e Barramentos ---
# CONFIG_I2C=y

# --- Suporte a Ponto Flutuante (Floats) nos Logs ---
CONFIG_CBPRINTF_FP_SUPPORT=y

#===aaa
